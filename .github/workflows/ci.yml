name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.12.2"
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=aerodiagnosis --cov-report=term-missing
      - name: Compile legacy migration boundary
        run: uv run python -m compileall -q code/python
      - name: Build distributions
        run: uv run --no-sync python -m hatchling build
