services:
  # ── Neo4j 知识图谱数据库 ──────────────────────
  neo4j:
    image: neo4j:5.26.30-community
    container_name: aerodiagnosis-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Local Neo4j Browser only
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in code/.env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库 ───────────────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: aerodiagnosis-chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

  # ── Python API 服务 ───────────────────────────
  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: aerodiagnosis-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./.env
    environment:
      GRAPH_STORE_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in code/.env}
      VECTOR_STORE_BACKEND: chroma_http
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - uploads:/app/uploads

volumes:
  neo4j_data:
  chroma_data:
  uploads:
